}

function showOverlay(html, wide) {
  needsRender = true;
  const o = $('overlay');
  clearTimeout(o.doorTimer);
  clearTimeout(o.hideTimer);
  o.classList.remove('hidden', 'leaving');
  $('sheet').innerHTML = `<div class="sheet print${wide ? ' wide' : ''}">${html}</div>`;
  if (!o.classList.contains('shut')) requestAnimationFrame(() => requestAnimationFrame(() => o.classList.add('shut')));
  const b = o.querySelector('button.play');
  if (b) b.onclick = start;
  return o;
}

function hideOverlay() {
  needsRender = true;
  const o = $('overlay');
  if (o.classList.contains('hidden') || o.classList.contains('leaving')) return;
  o.classList.add('leaving');
  o.doorTimer = setTimeout(() => o.classList.remove('shut'), 140);
  o.hideTimer = setTimeout(() => { o.classList.add('hidden'); o.classList.remove('leaving'); }, 700);
}

function titleScreen() {
  state = 'title';
  const o = showOverlay(`<span class="seal">重</span><h2>Kasane</h2><canvas class="demo"></canvas>
    <div class="keyrow">${controlKeys()}<button class="helpbtn" data-help aria-label="How to play">?</button></div>
    <button class="play seal-btn" aria-label="Begin">始</button>`);
  drawDemo(o.querySelector('canvas.demo'));
}

function openPick() {
  pickPending = false;
  sincePick = 0;
  const left = PICKABLE.filter(t => !pool.includes(t));
  const weight = t => RARITY[MATERIALS[t].rarity].weight;
  const synergy = left.filter(c => pool.some(p => reactsWith(c, p)));
  const first = weightedDraw(synergy, weight, 1);
  offer = shuffle([...first, ...weightedDraw(left.filter(c => !first.includes(c)), weight, 2 - first.length)]);
  state = 'pick';
  soft = false; resetInput();
  choosing = false;
  emptyWell();
  const o = showOverlay(`<span class="seal big">選</span>
    <div class="pickshelf">${pool.map(k => img(k)).join('')}<span class="slot">+</span></div>
    <div class="cards">${offer.map((type, i) => {
      const t = MATERIALS[type], r = RARITY[t.rarity];
      const partners = pool.filter(p => reactsWith(type, p));
      return `<button class="card" data-type="${type}" style="--c:${t.color};--r:${r.color}">${img(type, 'big')}
        <b>${t.name}<span class="pips">${r.pips}</span>${COARSE ? '' : `<kbd>${i + 1}</kbd>`}</b><span class="tag">${t.tag}</span>
        <div class="foot"><canvas class="shape"></canvas>${partners.length ? `<div class="reacts"><span class="op">⇄</span>${partners.slice(0, 5).map(p => img(p)).join('')}${partners.length > 5 ? `<span class="more">+${partners.length - 5}</span>` : ''}</div>` : ''}</div></button>`;
    }).join('')}</div>`);
  for (const b of o.querySelectorAll('.card')) {
    b.onclick = () => choose(b.dataset.type);
    drawShape(b.querySelector('canvas.shape'), b.dataset.type, 64, 28);
  }
  sfx.pick();
}

function emptyWell() {
  for (const p of ps) if (Math.random() < 0.35) puff('chip', p.x, p.y, p.t.color);
  ps = []; bonds = []; contacts.length = 0; touches.length = 0; nearMiss = [];
  active = null; lastPiece = null; dangerT = 0;
  buildGrid();
  shake = 4;
  needsRender = true;
}

function wipeBoard() {
  for (const p of ps) if (!p.clearing) { p.clearing = time; p.inv = 0; p.burn = 0; }
  active = null;
  lastPiece = null;
  dangerT = 0;
  spawnAt = time + FLASH + 0.15;
  shake = 5;
}

let choosing = false;
function choose(type) {
  if (state !== 'pick' || !offer.includes(type) || choosing) return;
  choosing = true;
  for (const c of document.querySelectorAll('#sheet .card')) c.classList.add(c.dataset.type === type ? 'chosen' : 'dismissed');
  const slot = document.querySelector('#sheet .pickshelf .slot');
  if (slot) slot.outerHTML = img(type);
  setTimeout(() => commitChoice(type), 520);
}

function commitChoice(type) {
  choosing = false;
  if (state !== 'pick') return;
  pool.push(type);
  bag = [];
  nextType = type;
  spawnAt = time + 0.35;
  drawNext();
  buildShelf();
  buildNotes();
  updateHud();
  state = 'play';
  hideOverlay();
  last = performance.now();
}

function startingPool() {
  const pairs = [];
  const plain = COMMONS.filter(k => !MATERIALS[k].copies);
  for (const a of plain) for (const b of plain) if (a < b && reactsWith(a, b)) pairs.push([a, b]);
  return [...pick(pairs)];
}

function start() {
  ps = []; bonds = []; contacts = []; touches = []; bag = []; popups = []; fx = [];
  pool = startingPool();
  score = 0; level = 1; clears = 0; combo = 0; comboT = 0; dangerT = 0; time = 0;
  sincePick = 0; pickPending = false; runFound = new Set();
  runId++; inFlight = 0; hitstop = 0; nearMiss = [];
  document.querySelectorAll('.flyer').forEach(el => el.remove());
  $('combo').innerHTML = '';
  releaseT = 0; lastPiece = null; busyT = -1;
  soft = false; resetInput(); active = null;
  nextType = drawType();
  drawNext();
  spawnAt = 0;
  spawnBlockedT = 0;
  buildGrid();
  buildShelf();
  buildNotes();
  state = 'play';
  hideOverlay();
  updateHud();
  sfx.unlock();
}

function gameOver() {
  state = 'over';
  active = null;
  if (score > best) { best = score; try { localStorage.setItem('walltowall-best', best); } catch {} }
  updateHud();
  sfx.over();
  showOverlay(`<div class="sheet-head"><span class="seal big">満</span><button class="play seal-btn" aria-label="Again">↺</button></div><p class="big">${score.toLocaleString()}</p>
    <div class="shelfrow">${pool.map(k => img(k)).join('')}</div>
`);
}

function togglePause() {
  if (state === 'play') {
    state = 'pause'; soft = false; resetInput();
    const o = showOverlay(`<span class="seal big">休</span>
      ${pool.length ? `${matListHtml()}<div class="rule"></div><ul class="notes">${reactionsHtml()}</ul>` : ''}
      <div class="actions"><button class="seal-btn alt" data-book aria-label="Notebook">帳</button><button class="play seal-btn" aria-label="Resume">▶</button><button class="seal-btn alt" data-help aria-label="How to play">?</button></div>`, pool.length > 0);
    o.querySelector('button.play').onclick = togglePause;
  }
  else if (state === 'pause') { state = 'play'; hideOverlay(); last = performance.now(); }
}

// ---------- sound ----------
const sfx = new Proxy({}, { get: () => () => {} });

// ---------- input ----------
const COARSE = matchMedia('(pointer: coarse)').matches;
const ROT_SPEED = 4.5;
const KICKS = [0];
for (let i = 1; i <= 12; i++) KICKS.push(i, -i);
const hold = { left: false, right: false };
let rotHold = 0, rotPressT = 0, rotFrom = 0, rotTarget = null, moveT = 0;
const buzz = ms => { if (COARSE && navigator.userActivation?.hasBeenActive) try { navigator.vibrate?.(ms); } catch {} };

function resetInput() { hold.left = hold.right = false; rotHold = 0; rotTarget = null; }

function moveBy(dx) {
  if (!active || !dx) return;
  const n = Math.ceil(Math.abs(dx) / 2), s = dx / n;
  for (let i = 0; i < n; i++) {
    if (blocked(active.x + s, active.y, active.offs)) return;
    active.x += s;
  }
}
const moveTo = tx => { if (active) moveBy(tx - active.x); };

const spin = (offs, a) => {
  const c = Math.cos(a), s = Math.sin(a);
  return offs.map(([x, y, k]) => [x * c - y * s, x * s + y * c, k]);
};

function setAngle(a) {
  if (!active) return false;
  const offs = spin(active.base, a);
  for (const k of KICKS)
    if (!blocked(active.x + k, active.y, offs)) { active.offs = offs; active.angle = a; active.x += k; return true; }
  return false;
}

function quarterTurn(dir) {
  if (!active) return;
  rotTarget = (rotTarget ?? active.angle) + dir * Math.PI / 2;
  sfx.rotate();
}

function steer(dt) {
  if (!active) return;
  const dir = (hold.right ? 1 : 0) - (hold.left ? 1 : 0);
  if (dir) { moveT += dt; moveBy(dir * Math.min(300, 110 + moveT * 500) * dt); } else moveT = 0;
  if (rotHold) setAngle(active.angle + rotHold * ROT_SPEED * dt);
  else if (rotTarget !== null) {
    const d = rotTarget - active.angle;
    if (Math.abs(d) < 1e-3 || !setAngle(active.angle + Math.sign(d) * Math.min(Math.abs(d), ROT_SPEED * 1.6 * dt))) rotTarget = null;
  }
}

function press(act) {
  if (state !== 'play') return;
  if (act === 'left' || act === 'right') { hold[act] = true; moveT = 0; moveBy(act === 'left' ? -3 : 3); }
  else if (act === 'rotate' || act === 'rotateL') {
    if (!active) return;
    rotHold = act === 'rotate' ? 1 : -1;
    rotPressT = time;
    rotFrom = active.angle;
    rotTarget = null;
  }
  else if (act === 'down') soft = true;
  else if (act === 'slam') slam();
}
function unpress(act) {
  if (act === 'left' || act === 'right') hold[act] = false;
  if ((act === 'rotate' || act === 'rotateL') && rotHold) {
    const dir = rotHold;
    rotHold = 0;
    if (active && time - rotPressT < 0.18) { rotTarget = rotFrom + dir * Math.PI / 2; sfx.rotate(); }
  }
  if (act === 'down') soft = false;
}

const KEYS = {
  ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right',
  ArrowUp: 'rotate', KeyW: 'rotate', KeyX: 'rotate', KeyZ: 'rotateL',
  ArrowDown: 'down', KeyS: 'down', Space: 'slam',
};
addEventListener('keydown', e => {
  if (state === 'pick') {
    const i = { Digit1: 0, Digit2: 1, Numpad1: 0, Numpad2: 1 }[e.code];
    if (i !== undefined && offer[i]) choose(offer[i]);
    if (e.code === 'Space') e.preventDefault();
    return;
  }
  if (state === 'help') { if (e.code === 'Escape' || e.code === 'KeyH' || e.code === 'Enter') closeHelp(); return; }
  if (e.code === 'KeyH' || e.key === '?') { openHelp(); return; }
  if (state === 'book') { if (e.code === 'Escape' || e.code === 'KeyN') closeBook(); return; }
  if (e.code === 'KeyN') { openBook(); return; }
  if (e.code === 'KeyP' || e.code === 'Escape') { togglePause(); return; }
  if ((e.code === 'Enter' || e.code === 'Space') && (state === 'title' || state === 'over')) { e.preventDefault(); start(); return; }
  const act = KEYS[e.code];
  if (!act) return;
  e.preventDefault();
  if (!e.repeat) press(act);
});
addEventListener('keyup', e => { const act = KEYS[e.code]; if (act) unpress(act); });

document.addEventListener('click', e => {
  if (e.target.closest('#helpbtn, #helpbtn2, [data-help]')) openHelp();
  if (e.target.closest('[data-book]')) openBook();
  if (e.target.closest('#pausebtn, #pausebtn2') && (state === 'play' || state === 'pause')) togglePause();
});
$('overlay').addEventListener('click', e => {
  if (e.target.closest('.sheet')) return;
  if (state === 'pause') togglePause();
  else if (state === 'book') closeBook();
  else if (state === 'help') closeHelp();
});

const stageEl = $('stage');
let drag = null;
stageEl.addEventListener('pointerdown', e => {
  if (state !== 'play' || !active || e.target.closest('#overlay')) return;
  e.preventDefault();
  try { stageEl.setPointerCapture(e.pointerId); } catch {}
  drag = { id: e.pointerId, x: e.clientX, y: e.clientY, t: performance.now(), piece: active, ax: active.x, moved: false };
});
stageEl.addEventListener('pointermove', e => {
  if (!drag || e.pointerId !== drag.id || state !== 'play' || !active) return;
  if (active !== drag.piece) { drag.piece = active; drag.ax = active.x; drag.x = e.clientX; drag.y = e.clientY; }
  const dx = (e.clientX - drag.x) / S, dy = (e.clientY - drag.y) / S;
  if (Math.abs(dx) > 3 || Math.abs(dy) > 6) drag.moved = true;
  moveTo(drag.ax + dx * (e.pointerType === 'touch' ? 1.25 : 1));
  soft = dy > 28 && Math.abs(dy) > Math.abs(dx);
});
const endDrag = e => {
  if (!drag || e.pointerId !== drag.id) return;
  const dt = performance.now() - drag.t, dx = (e.clientX - drag.x) / S, dy = (e.clientY - drag.y) / S;
  if (state === 'play') {
    if (!drag.moved && dt < 300) quarterTurn(1);
    else if (dy > 40 && dt < 320 && dy > Math.abs(dx) * 1.5) slam();
  }
  soft = false;
  drag = null;
};
stageEl.addEventListener('pointerup', endDrag);
stageEl.addEventListener('pointercancel', () => { drag = null; soft = false; });

document.addEventListener('visibilitychange', () => { if (document.hidden && state === 'play') togglePause(); });
new ResizeObserver(() => { fit(); drawNext(); }).observe($('stage'));

const scenery = $('scenery');
for (let i = 0; i < 7; i++) {
  const petal = document.createElement('img');
  petal.className = 'petal';
  petal.src = 'assets/fx-petal.png';
  petal.alt = '';
  petal.style.cssText = `--x: ${Math.random() * 100}vw; --dur: ${70 + Math.random() * 40}s; --delay: ${-Math.random() * 110}s; width: ${11 + Math.random() * 8}px`;
  scenery.append(petal);
}
function sendCrane() {
  if (!matchMedia('(prefers-reduced-motion: reduce)').matches && !document.hidden && state !== 'play') {
    const crane = document.createElement('img'), rtl = Math.random() < 0.5, dur = 45 + Math.random() * 20;
    crane.className = 'crane';
    crane.alt = '';
    crane.src = 'assets/fx-crane-up.png';
    crane.style.cssText = `top: ${5 + Math.random() * 22}vh; --dur: ${dur}s; --dir: ${rtl ? -1 : 1}; --x0: ${rtl ? '105vw' : '-10vw'}; --x1: ${rtl ? '-10vw' : '105vw'}`;
    scenery.append(crane);
    let up = true;
    const flap = setInterval(() => { up = !up; crane.src = `assets/fx-crane-${up ? 'up' : 'down'}.png`; }, 650);
    crane.addEventListener('animationend', () => { clearInterval(flap); crane.remove(); });
  }
  setTimeout(sendCrane, 60000 + Math.random() * 60000);
}
setTimeout(sendCrane, 20000);

fit();
updateHud();
buildNotes();
titleScreen();
document.fonts?.ready.then(() => { if (state === 'title') titleScreen(); });
requestAnimationFrame(frame);
</script>
</body>
</html>
